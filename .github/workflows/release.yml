name: verify-release

# The signed Nintendall build is produced on the release machine: the emulator
# upstream trees are vendored into cores/*/upstream and are intentionally not
# committed to git.  GitHub-hosted runners therefore cannot rebuild the app.
#
# This workflow verifies the assets that are actually published instead of
# trying to compile sources that are not in the repository.  It runs after a
# release is published, or manually for an existing tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (empty = latest release)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify:
    name: Verify release assets
    runs-on: windows-2022

    steps:
      - name: Resolve release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if (-not $tag) { $tag = '${{ github.event.inputs.tag }}' }
          if (-not $tag) {
            $tag = gh release view --repo '${{ github.repository }}' --json tagName --jq .tagName
          }
          if (-not $tag) { throw 'No release tag supplied and no latest release found.' }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verifying release $tag"

      - name: Download release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          gh release download $env:TAG `
            --repo '${{ github.repository }}' `
            --dir release-assets `
            --pattern 'Nintendall-Setup.exe' `
            --pattern 'Nintendall-Setup.exe.sha256' `
            --pattern 'Nintendall-Portable.zip' `
            --pattern 'Nintendall-Portable.zip.sha256'
          Get-ChildItem release-assets | Select-Object Name,Length | Format-Table -AutoSize

      - name: Verify checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location release-assets
          foreach ($name in @('Nintendall-Setup.exe', 'Nintendall-Portable.zip')) {
            $line = (Get-Content -LiteralPath "$name.sha256" -Raw).Trim()
            $expected = ($line -split '\s+')[0].ToLowerInvariant()
            if ($expected -notmatch '^[0-9a-f]{64}$') { throw "Malformed checksum file for $name" }
            $actual = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Checksum mismatch for $name" }
            Write-Host ("OK {0} ({1:N0} bytes) {2}" -f $name, (Get-Item -LiteralPath $name).Length, $actual)
          }

      - name: Verify installer signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = Get-AuthenticodeSignature -LiteralPath 'release-assets\Nintendall-Setup.exe'
          if ($sig.SignatureType -eq 'None' -or -not $sig.SignerCertificate) {
            throw 'Nintendall-Setup.exe is not Authenticode-signed.'
          }
          if ($sig.SignerCertificate.Subject -notlike 'CN=Nintendall*') {
            throw "Unexpected signer: $($sig.SignerCertificate.Subject)"
          }
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          Write-Host "Signature status on runner: $($sig.Status)"

      - name: Verify portable payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath 'release-assets\Nintendall-Portable.zip' -DestinationPath portable -Force
          foreach ($name in @('nintendall.exe', 'README.md', 'SDL3.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'portable' $name))) {
              throw "Portable zip is missing $name"
            }
          }
          Write-Host 'Portable payload complete.'
