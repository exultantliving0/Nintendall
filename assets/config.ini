; ============================================================================
;  Nintendall - configuration
; ============================================================================
;
;  NOTE: The current build does NOT read this file yet. It documents the
;  built-in defaults and reserves the canonical place for settings, so a
;  packaged build has somewhere to grow into. Editing the values below has no
;  effect until the config loader is wired up.
;
;  What the app actually does today:
;    * Battery saves and save states are written next to the executable,
;      in a "saves" folder that is created on launch (relative to the .exe).
;    * Audio is emitted at 48 kHz, stereo, at full volume.
;    * The console framebuffer is scaled to fit the window, preserving aspect.
;    * Keyboard mapping is fixed (see README.md).

[video]
; Integer scale of the console framebuffer when it fits in the window.
scale = 3
; Preserve the original 4:3-ish aspect ratio instead of square pixels.
preserve_aspect = 1

[audio]
; Output sample rate in Hz.
sample_rate = 48000
; Playback volume, 0..100.
volume = 100

[paths]
; Where .sav / .srm battery files and .uesv save states are stored.
; Relative paths are resolved against the folder containing the executable.
save_dir = saves

[input]
; Keyboard -> virtual controller mapping (informational; fixed in this build).
;   D-pad  : Arrow keys
;   A      : X        B : Z        X : S        Y : A
;   L      : Q        R : W
;   Start  : Enter    Select : Shift
; Menu shortcuts (always active):
;   F5 = Save state (slot)   F8 = Load state (slot)   F2 = Reset   Space = Pause
